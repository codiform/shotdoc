<!doctype html><meta charset=utf-8><title>Annotate</title>
<link rel=stylesheet href="annotate.css">
<section id=a></section>
<section id=b></section>
<section id=panel></section>
<section id=inner></section>
<section id=edge></section>
<section id=tall></section>
<section id=far></section>
<section class=twin id=t1></section>
<section class=twin id=t2></section>
<script>
  // Page elements are <section>, so this stylesheet reaches only what shotdoc adds to the page.
  if (location.hash === '#hostile') {
    const s = document.createElement('style');
    s.textContent = 'div, span, svg, g, polygon { border: 6px dashed lime !important; margin: 20px !important; padding: 9px !important; box-sizing: content-box !important; font: italic 40px serif !important; color: lime !important; background: yellow !important; opacity: 0.5 !important; transform: rotate(7deg) !important; text-transform: uppercase !important; letter-spacing: 9px !important; }';
    document.head.append(s);
  }
  setTimeout(() => {
    const e = document.createElement('section');
    e.id = 'late';
    e.style.cssText = 'position:absolute;left:200px;top:600px;width:60px;height:40px;background:rgb(255,140,0)';
    document.body.append(e);
  }, 500);
</script>
