<!doctype html><meta charset=utf-8><title>Slide</title>
<style>body{margin:0}#card{position:absolute;top:100px;left:500px;width:200px;height:100px;background:rgb(255,0,0)}#ghost{display:none}</style>
<div id=card></div><div id=ghost>hidden</div>
<script>
  const t0 = performance.now(), card = document.getElementById('card');
  (function step(now) {
    const p = Math.min(1, (now - t0) / 800);
    card.style.left = (500 - 400 * p) + 'px';
    if (p < 1) requestAnimationFrame(step);
  })(t0);
</script>
