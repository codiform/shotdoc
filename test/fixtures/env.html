<!doctype html><meta charset=utf-8><title>Env</title>
<pre id=env></pre>
<script>
  document.getElementById('env').textContent = JSON.stringify({

    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    w: innerWidth, h: innerHeight, dpr: devicePixelRatio,
  });
</script>
