<!doctype html><meta charset=utf-8><title>Resize</title>
<style>body{margin:0}#card{box-shadow:inset 0 0 0 1px rgb(0,0,0);position:absolute;top:50px;left:50px;width:200px;height:100px;background:rgb(0,160,0)}</style>
<div id=card></div>
<script>
  window.resized = 0;
  addEventListener('resize', () => { window.resized++; document.getElementById('card')?.remove(); });
</script>
