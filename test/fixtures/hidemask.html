<!doctype html><meta charset=utf-8><title>Hide and mask</title>
<style>
  body { margin: 0; background: rgb(245,245,245); height: 2200px; position: relative; }
  .box { position: absolute; }
  #banner { left: 0; top: 0; width: 100%; height: 40px; background: rgb(255,235,59); }
  #after { left: 0; top: 40px; width: 60px; height: 40px; background: rgb(0,0,200); }
  #a { left: 20px; top: 100px; width: 100px; height: 50px; background: rgb(200,0,0); }
  #b { left: 140px; top: 100px; width: 100px; height: 50px; background: rgb(0,150,0); }
  .date { left: 20px; width: 100px; height: 30px; background: rgb(200,0,200); }
  #d1 { top: 200px; } #d2 { top: 240px; } #d3 { top: 280px; }
  #card { left: 400px; top: 100px; width: 200px; height: 100px; background: rgb(255,255,255); box-shadow: inset 0 0 0 1px rgb(0,0,0); }
  #secret { left: 20px; top: 20px; width: 100px; height: 30px; background: rgb(200,0,0); }
  #tall { left: 700px; top: 100px; width: 300px; height: 1600px; background: rgb(255,255,255); box-shadow: inset 0 0 0 1px rgb(0,0,0); }
  #far { left: 50px; top: 1300px; width: 100px; height: 40px; background: rgb(200,0,0); }
  #keep { left: 20px; top: 340px; width: 100px; height: 30px; background: rgb(0,150,0); }
</style>
<div class=box id=banner>This is just a demo, <a href="#">not the real app</a></div>
<div class=box id=after></div>
<div class=box id=a></div>
<div class=box id=b></div>
<div class="box date" id=d1>2026-01-01</div>
<div class="box date" id=d2>2026-01-02</div>
<div class="box date" id=d3>2026-01-03</div>
<div class=box id=gone style="display: none">gone</div>
<div class=box id=keep style="visibility: visible"></div>
<div class=box id=card><div class=box id=secret></div></div>
<div class=box id=tall><div class=box id=far></div></div>
<script>
  setTimeout(() => {
    const e = document.createElement('div');
    e.className = 'box'; e.id = 'late';
    e.style.cssText = 'left:260px;top:100px;width:60px;height:50px;background:rgb(255,140,0)';
    document.body.append(e);
  }, 500);
</script>
